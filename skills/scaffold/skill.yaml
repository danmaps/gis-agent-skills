id: scaffold
name: scaffold
version: 0.1.0
scope: public
description: Turn an ArcPy script into a maintainable project structure without unnecessary architecture.
inputs:
  - name: task_description
    type: string
    required: true
    description: Description of the ArcPy workflow or script.
  - name: current_script_path
    type: string
    required: false
    description: Path to the existing ArcPy script being evaluated or migrated.
  - name: project_root
    type: string
    required: false
    description: Target project root for any recommended structure.
  - name: workflow_type
    type: string
    required: false
    description: Workflow shape such as single_script, batch, script_tool, or python_toolbox.
  - name: constraints
    type: string
    required: false
    description: Constraints that limit the structure or migration approach.
  - name: target_environment
    type: string
    required: false
    description: Runtime environment such as ArcGIS Pro on Windows, a scheduled task, or a toolbox.
outputs:
  - name: result
    type: string
    description: Recommended structure, migration plan, and testing boundaries.
safety:
  read_only: true
  notes: Advisory skill — recommends project structure and migration steps only.
artifacts: []
entrypoint: SKILL.md
